[env:esp32dev]
; Pinned for reproducibility — the previous unpinned "espressif32" pulled a
; brand-new core (4.20017) whose UART0 pin behavior differs from the build
; that was originally validated on this device. 7.1.2 is the version this
; firmware is built and validated against.
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
; PZEM004_SOFTSERIAL enables the PZEM library's software-serial constructors,
; used for PZEM-C (GPIO18/19) so UART0 remains reserved for the debug console.
build_flags = -std=gnu++17 -DPZEM004_SOFTSERIAL
lib_deps =
    mandulaj/PZEM-004T-v30@^1.1.2
    bblanchon/ArduinoJson@^7.0.0
    adafruit/RTClib@^2.1.1
    links2004/WebSockets@^2.4.0
    plerup/EspSoftwareSerial@^8.2.0

; ────────────────────────────────────────────────────────────
; TEMPORARY DIAGNOSTIC ENV — not the production build.
; Network-free GPIO25/relay actuation test. Compiles only relay.cpp
; (production relay functions/polarity) and the diagnostic sketch.
; Build:  pio run -e relaydiag
; This environment is intentionally excluded from production; do not
; use for normal firmware.
; ────────────────────────────────────────────────────────────
[env:relaydiag]
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
build_src_filter =
    +<relay.cpp>
    +<diag_relay/>
